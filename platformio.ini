[platformio]
src_dir = firmware/robot_firmware
default_envs = esp32s3

[env:esp32s3]
platform = espressif32@6.12.0           ; Arduino-ESP32 core 2.0.17
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi   ; N16R8: 16MB flash, octal PSRAM
board_upload.flash_size = 16MB
monitor_speed = 115200
lib_deps =
    madhephaestus/ESP32Servo
